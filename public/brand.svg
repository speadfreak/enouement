<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050A07"/>
      <stop offset="1" stop-color="#0B130E"/>
    </linearGradient>
    <linearGradient id="mark" x1="80" y1="80" x2="432" y2="432" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE600"/>
      <stop offset="0.55" stop-color="#FFD60A"/>
      <stop offset="1" stop-color="#00C853"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="4" y="4" width="504" height="504" rx="110" fill="none" stroke="url(#mark)" stroke-opacity="0.25" stroke-width="2"/>
  <!-- E monogram -->
  <g filter="url(#glow)">
    <path d="M168 128 H344 V176 H224 V232 H320 V280 H224 V336 H344 V384 H168 Z" fill="url(#mark)"/>
  </g>
  <!-- 27 accent -->
  <text x="256" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="800" fill="url(#mark)" opacity="0.9">2K27</text>
</svg>
